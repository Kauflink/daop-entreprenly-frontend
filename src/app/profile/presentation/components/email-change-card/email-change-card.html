<div class="card">
  <h2 class="card__title">Cambiar email con re-verificación</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="newEmail" class="field__label">Nuevo email</label>
      <div class="field__row">
        <input
          id="newEmail"
          type="email"
          formControlName="email"
          class="field__input"
          placeholder="nuevo-correo@entreprenly.online"
          autocomplete="email"
        />
        <button type="submit" class="btn-verify" [disabled]="form.invalid">Verificar</button>
      </div>
    </div>
  </form>
</div>
