<div class="card">
  <h2 class="card__title">{{ 'profile.emailChange.title' | translate }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="newEmail" class="field__label">
        {{ 'profile.emailChange.fields.email.label' | translate }}
      </label>
      <div class="field__row">
        <input
          id="newEmail"
          type="email"
          formControlName="email"
          class="field__input"
          [placeholder]="'profile.emailChange.fields.email.placeholder' | translate"
          autocomplete="email"
        />
        <button type="submit" class="btn-verify" [disabled]="form.invalid || status() === 'pending'">
          {{ 'profile.emailChange.verifyAction' | translate }}
        </button>
      </div>
      @if (status() === 'success') {
        <p class="field__success" role="status">
          {{ 'profile.emailChange.feedback.success' | translate }}
        </p>
      }
      @if (status() === 'error') {
        <p class="field__error" role="alert">
          {{ 'profile.emailChange.feedback.error' | translate }}
        </p>
      }
    </div>
  </form>
</div>
