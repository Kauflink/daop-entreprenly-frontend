<div class="card">
  <h2 class="card__title">{{ 'profile.accountSecurity.title' | translate }}</h2>

  <section class="section">
    <h3 class="section__title">{{ 'profile.phoneVerify.title' | translate }}</h3>
    <form [formGroup]="phoneForm" (ngSubmit)="onPhoneSubmit()" novalidate>
      <div class="field">
        <label for="phone" class="field__label">
          {{ 'profile.phoneVerify.fields.phone.label' | translate }}
        </label>
        <div class="field__row">
          <input
            id="phone"
            type="tel"
            formControlName="phone"
            class="field__input"
            [placeholder]="'profile.phoneVerify.fields.phone.placeholder' | translate"
            autocomplete="tel"
          />
          <button type="submit" class="btn-verify" [disabled]="phoneForm.invalid">
            {{ 'profile.phoneVerify.verifyAction' | translate }}
          </button>
        </div>
      </div>
    </form>
  </section>

  <section class="section">
    <h3 class="section__title">{{ 'profile.emailChange.title' | translate }}</h3>
    <form [formGroup]="emailForm" (ngSubmit)="onEmailSubmit()" novalidate>
      <div class="field">
        <label for="newEmail" class="field__label">
          {{ 'profile.emailChange.fields.email.label' | translate }}
        </label>
        <div class="field__row">
          <input
            id="newEmail"
            type="email"
            formControlName="email"
            class="field__input"
            [placeholder]="'profile.emailChange.fields.email.placeholder' | translate"
            autocomplete="email"
          />
          <button type="submit" class="btn-verify" [disabled]="emailForm.invalid">
            {{ 'profile.emailChange.verifyAction' | translate }}
          </button>
        </div>
      </div>
    </form>
  </section>

  <section class="section">
    <h3 class="section__title">{{ 'profile.changePassword.title' | translate }}</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="onPasswordSubmit()" novalidate>
      <div class="field">
        <label for="currentPassword" class="field__label">
          {{ 'profile.changePassword.fields.current.label' | translate }}
        </label>
        <div class="field__input-wrap">
          <input
            id="currentPassword"
            [type]="showCurrent() ? 'text' : 'password'"
            formControlName="currentPassword"
            class="field__input"
            [placeholder]="'profile.changePassword.fields.current.placeholder' | translate"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="showCurrent.set(!showCurrent())"
            [attr.aria-label]="
              (showCurrent()
                ? 'profile.changePassword.fields.current.hideLabel'
                : 'profile.changePassword.fields.current.showLabel'
              ) | translate
            "
          >
            <mat-icon>{{ showCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="newPassword" class="field__label">
          {{ 'profile.changePassword.fields.new.label' | translate }}
        </label>
        <div class="field__input-wrap">
          <input
            id="newPassword"
            [type]="showNew() ? 'text' : 'password'"
            formControlName="newPassword"
            class="field__input"
            [placeholder]="'profile.changePassword.fields.new.placeholder' | translate"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="showNew.set(!showNew())"
            [attr.aria-label]="
              (showNew()
                ? 'profile.changePassword.fields.new.hideLabel'
                : 'profile.changePassword.fields.new.showLabel'
              ) | translate
            "
          >
            <mat-icon>{{ showNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword" class="field__label">
          {{ 'profile.changePassword.fields.confirm.label' | translate }}
        </label>
        <div class="field__input-wrap">
          <input
            id="confirmPassword"
            [type]="showConfirm() ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="field__input"
            [class.field__input--error]="mismatch"
            [placeholder]="'profile.changePassword.fields.confirm.placeholder' | translate"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="showConfirm.set(!showConfirm())"
            [attr.aria-label]="
              (showConfirm()
                ? 'profile.changePassword.fields.confirm.hideLabel'
                : 'profile.changePassword.fields.confirm.showLabel'
              ) | translate
            "
          >
            <mat-icon>{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        @if (mismatch) {
          <p class="field__error" role="alert">
            {{ 'profile.changePassword.errors.mismatch' | translate }}
          </p>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid">
        {{ 'profile.changePassword.updateAction' | translate }}
      </button>
    </form>
  </section>
</div>
