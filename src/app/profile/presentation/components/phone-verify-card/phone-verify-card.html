<div class="card">
  <h2 class="card__title">{{ 'profile.phoneVerify.title' | translate }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="phone" class="field__label">
        {{ 'profile.phoneVerify.fields.phone.label' | translate }}
      </label>
      <div class="field__row">
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          class="field__input"
          [placeholder]="'profile.phoneVerify.fields.phone.placeholder' | translate"
          autocomplete="tel"
        />
        <button type="submit" class="btn-verify" [disabled]="form.invalid">
          {{ 'profile.phoneVerify.verifyAction' | translate }}
        </button>
      </div>
    </div>
  </form>
</div>
