<div class="card">
  <h2 class="card__title">Preferencias de idioma, zona horario y tema</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="language" class="field__label">Idioma</label>
      <select id="language" formControlName="language" class="field__select">
        @for (lang of languages; track lang) {
          <option [value]="lang">{{ lang }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="timezone" class="field__label">Zona horario</label>
      <select id="timezone" formControlName="timezone" class="field__select">
        @for (tz of timezones; track tz) {
          <option [value]="tz">{{ tz }}</option>
        }
      </select>
    </div>

    <button type="submit" class="btn-primary">Guardar preferencias</button>

    <div class="field">
      <span class="field__label" id="theme-label">Tema visual</span>
      <div class="theme-toggle" role="group" aria-labelledby="theme-label">
        <button
          type="button"
          class="theme-btn"
          [class.theme-btn--active]="form.get('theme')!.value === 'light'"
          (click)="setTheme('light')"
          aria-pressed="{{ form.get('theme')!.value === 'light' }}"
        >
          Claro
        </button>
        <button
          type="button"
          class="theme-btn"
          [class.theme-btn--inactive]="form.get('theme')!.value === 'light'"
          (click)="setTheme('dark')"
          aria-pressed="{{ form.get('theme')!.value === 'dark' }}"
        >
          Oscuro
        </button>
      </div>
    </div>
  </form>
</div>
