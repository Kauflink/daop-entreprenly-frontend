<div class="card">
  <h2 class="card__title">Cambiar contraseña</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="currentPassword" class="field__label">Contraseña actual</label>
      <div class="field__input-wrap">
        <input
          id="currentPassword"
          [type]="showCurrent() ? 'text' : 'password'"
          formControlName="currentPassword"
          class="field__input"
          placeholder="Contraseña actual"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="field__toggle"
          (click)="showCurrent.set(!showCurrent())"
          [attr.aria-label]="showCurrent() ? 'Ocultar contraseña actual' : 'Mostrar contraseña actual'"
        >
          <mat-icon>{{ showCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="newPassword" class="field__label">Nueva contraseña</label>
      <div class="field__input-wrap">
        <input
          id="newPassword"
          [type]="showNew() ? 'text' : 'password'"
          formControlName="newPassword"
          class="field__input"
          placeholder="Nueva contraseña"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="field__toggle"
          (click)="showNew.set(!showNew())"
          [attr.aria-label]="showNew() ? 'Ocultar nueva contraseña' : 'Mostrar nueva contraseña'"
        >
          <mat-icon>{{ showNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword" class="field__label">Confirmar nueva contraseña</label>
      <div class="field__input-wrap">
        <input
          id="confirmPassword"
          [type]="showConfirm() ? 'text' : 'password'"
          formControlName="confirmPassword"
          class="field__input"
          [class.field__input--error]="mismatch"
          placeholder="Confirmar nueva contraseña"
          autocomplete="new-password"
        />
        <button
          type="button"
          class="field__toggle"
          (click)="showConfirm.set(!showConfirm())"
          [attr.aria-label]="showConfirm() ? 'Ocultar confirmación' : 'Mostrar confirmación'"
        >
          <mat-icon>{{ showConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (mismatch) {
        <p class="field__error" role="alert">Las contraseñas no coinciden.</p>
      }
    </div>

    <button type="submit" class="btn-primary" [disabled]="form.invalid">
      Actualizar contraseña
    </button>
  </form>
</div>
