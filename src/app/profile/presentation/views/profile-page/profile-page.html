<main class="page" aria-label="Configuracion de perfil">
  <div class="grid">
    <section class="profile-panel profile-panel--user" aria-label="Informacion del usuario">
      <app-user-info-card />
    </section>

    <section class="profile-panel profile-panel--update" aria-label="Datos del perfil">
      <app-update-profile-card />
    </section>

    <section class="profile-panel profile-panel--preferences" aria-label="Preferencias">
      <app-preferences-card />
    </section>

    <section class="profile-panel profile-panel--photo" aria-label="Foto de perfil">
      <app-upload-photo-card />
    </section>

    <section class="profile-panel profile-panel--phone" aria-label="Telefono">
      <app-phone-verify-card />
    </section>

    <section class="profile-panel profile-panel--email" aria-label="Email">
      <app-email-change-card />
    </section>

    <section class="profile-panel profile-panel--notifications" aria-label="Notificaciones">
      <app-notifications-card />
    </section>

    <section class="profile-panel profile-panel--password" aria-label="Contrasena">
      <app-change-password-card />
    </section>
  </div>
</main>
