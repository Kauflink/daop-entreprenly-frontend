<main class="page" aria-label="Configuración de perfil">
  <div class="grid">
    <!-- Columna izquierda: info + foto -->
    <section class="col col--left" aria-label="Foto de perfil">
      <app-user-info-card />
      <app-upload-photo-card />
    </section>

    <!-- Columna central: actualizar perfil + teléfono -->
    <section class="col col--center" aria-label="Datos del perfil">
      <app-update-profile-card />
      <app-phone-verify-card />
    </section>

    <!-- Columna derecha: preferencias + email -->
    <section class="col col--right" aria-label="Preferencias y email">
      <app-preferences-card />
      <app-email-change-card />
    </section>

    <!-- Fila inferior: notificaciones + contraseña -->
    <div class="col col--bottom">
      <section aria-label="Notificaciones">
        <app-notifications-card />
      </section>
      <section aria-label="Seguridad">
        <app-change-password-card />
      </section>
    </div>
  </div>
</main>
