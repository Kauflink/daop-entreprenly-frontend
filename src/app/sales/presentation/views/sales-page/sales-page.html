<div class="sales-page">
  <header class="page-header">
    <h1>Ventas</h1>
    <p class="subtitle">Registra y procesa las ventas del día</p>
  </header>

  <div class="main-layout">
    <div class="left-column">
      <app-sales-cart
        [ticketItems]="ticketItems()"
        [showEmptyError]="showEmptyTicketError()"
        [products]="store.products()"
        [loading]="store.loading()"
        (productSelected)="onProductSelected($event)"
        (itemDeleted)="onItemDeleted($event)"
      />

      <app-cash-summary />
    </div>

    <aside class="right-column">
      <section class="card summary-card">
        <h2 class="card-title">
          <span class="title-icon">☀</span>
          Resumen
        </h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span>S/ {{ subtotal().toFixed(2) }}</span>
        </div>
        <div class="summary-row">
          <span>Items</span>
          <span>{{ itemCount() }} productos</span>
        </div>
        <hr />
        <div class="summary-total">
          <span>Total</span>
          <span class="total-value">S/ {{ subtotal().toFixed(2) }}</span>
        </div>
      </section>

      <app-payment-method
        [hasItems]="itemCount() > 0"
        [selectedMethod]="paymentMethod()"
        [showError]="showPaymentError()"
        (methodSelected)="onMethodSelected($event)"
        (finalizeSale)="onFinalizeSale()"
        (cancelSale)="onCancelSale()"
      />
    </aside>
  </div>

  @if (isQuantityModalOpen()) {
  <app-quantity-modal
    [product]="selectedProduct()!"
    (confirm)="onQuantityConfirm($event)"
    (cancel)="onQuantityCancel()"
  />
  }

  @if (isWeightModalOpen()) {
  <app-weight-modal
    [product]="selectedProduct()!"
    (confirm)="onWeightConfirm($event)"
    (cancel)="onWeightCancel()"
  />
  }

  @if (showSuccessModal()) {
  <div class="modal-backdrop" (click)="onCloseSuccessModal()">
    <div class="success-modal" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="onCloseSuccessModal()">✕</button>
      <h2 class="success-title">Venta Exitosa</h2>
      <div class="success-check">✅</div>
    </div>
  </div>
  }
</div>
