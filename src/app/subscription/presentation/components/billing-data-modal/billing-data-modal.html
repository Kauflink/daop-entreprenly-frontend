<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="billing-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="billing-data-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button
    class="icon-button"
    type="button"
    [attr.aria-label]="'subscription.modal.close' | translate"
    (click)="close()"
  >×</button>
  <p class="eyebrow">{{ 'subscription.modal.eyebrow' | translate }}</p>
  <h2 id="billing-data-modal-title">{{ 'subscription.billingData.title' | translate }}</h2>

  <form class="modal-form" [formGroup]="fiscalForm" (ngSubmit)="save()">
    <label>
      <span>{{ 'subscription.upgrade.billing.documentType' | translate }}</span>
      <select formControlName="documentType">
        <option value="RUC">RUC</option>
        <option value="DNI">DNI</option>
        <option value="CE">CE</option>
      </select>
    </label>

    <label>
      <span>{{ 'subscription.upgrade.billing.documentNumber' | translate }}</span>
      <input
        type="text"
        inputmode="numeric"
        autocomplete="off"
        formControlName="documentNumber"
        [attr.aria-invalid]="hasFieldError('documentNumber')"
      />
      @if (hasFieldError('documentNumber')) {
        <small>{{ 'subscription.upgrade.billing.documentNumberError' | translate }}</small>
      }
    </label>

    <label>
      <span>{{ 'subscription.upgrade.billing.businessName' | translate }}</span>
      <input
        type="text"
        autocomplete="organization"
        formControlName="businessName"
        [attr.aria-invalid]="hasFieldError('businessName')"
      />
      @if (hasFieldError('businessName')) {
        <small>{{ 'subscription.upgrade.billing.businessNameError' | translate }}</small>
      }
    </label>

    <label>
      <span>{{ 'subscription.upgrade.billing.receiptEmail' | translate }}</span>
      <input
        type="email"
        autocomplete="email"
        formControlName="receiptEmail"
        [attr.aria-invalid]="hasFieldError('receiptEmail')"
      />
      @if (hasFieldError('receiptEmail')) {
        <small>{{ 'subscription.upgrade.billing.receiptEmailError' | translate }}</small>
      }
    </label>

    <label class="field-wide">
      <span>{{ 'subscription.upgrade.billing.fiscalAddress' | translate }}</span>
      <input
        type="text"
        autocomplete="street-address"
        formControlName="fiscalAddress"
        [attr.aria-invalid]="hasFieldError('fiscalAddress')"
      />
      @if (hasFieldError('fiscalAddress')) {
        <small>{{ 'subscription.upgrade.billing.fiscalAddressError' | translate }}</small>
      }
    </label>

    <div class="modal-actions">
      <button class="secondary-button" type="button" (click)="close()">
        {{ 'subscription.billingData.cancel' | translate }}
      </button>
      <button class="primary-button" type="submit">
        {{ 'subscription.billingData.save' | translate }}
      </button>
    </div>
  </form>
</section>
