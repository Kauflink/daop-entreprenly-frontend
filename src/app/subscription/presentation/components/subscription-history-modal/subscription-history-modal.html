<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="history-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="history-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button class="icon-button" type="button" aria-label="Cerrar modal" (click)="close()">×</button>
  <p class="eyebrow">Suscripción</p>
  <h2 id="history-modal-title">Historial de suscripción</h2>

  <div class="history-list" role="table" aria-label="Historial de suscripción">
    @for (item of activityRows(); track item.id) {
      <div class="activity-row" role="row">
        <strong role="cell">{{ item.title }}</strong>
        <span role="cell">{{ item.detail }}</span>
      </div>
    }
  </div>

  @if (downloaded()) {
    <p class="success-message" role="status" aria-live="polite">
      Historial descargado correctamente con la actividad visible de la suscripción.
    </p>
  }

  <button class="primary-button" type="button" (click)="requestHistoryDownload()">
    Descargar historial
  </button>
</section>
