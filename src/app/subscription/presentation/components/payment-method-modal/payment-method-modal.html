<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="billing-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="payment-method-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button class="icon-button" type="button" aria-label="Cerrar modal" (click)="close()">×</button>
  <p class="eyebrow">Suscripción</p>
  <h2 id="payment-method-modal-title">Agregar método de pago</h2>

  <form class="modal-form" [formGroup]="paymentForm" (ngSubmit)="save()">
    <label>
      <span>Número de tarjeta</span>
      <div class="card-number-field">
        <input
          type="text"
          inputmode="numeric"
          autocomplete="cc-number"
          formControlName="cardNumber"
          placeholder="4242 4242 4242 4242"
          [attr.aria-invalid]="hasFieldError('cardNumber')"
        />
        <app-card-brand-badge [brand]="detectedCardBrand()" />
      </div>
      @if (hasFieldError('cardNumber')) {
        <small>Ingresa un número de tarjeta válido.</small>
      }
    </label>

    <label>
      <span>Titular</span>
      <input
        type="text"
        autocomplete="cc-name"
        formControlName="holderName"
        placeholder="Nombre del titular"
        [attr.aria-invalid]="hasFieldError('holderName')"
      />
      @if (hasFieldError('holderName')) {
        <small>Ingresa el nombre del titular.</small>
      }
    </label>

    <label>
      <span>Vencimiento</span>
      <input
        type="text"
        inputmode="numeric"
        autocomplete="cc-exp"
        formControlName="expiry"
        placeholder="12/29"
        [attr.aria-invalid]="hasFieldError('expiry')"
      />
      @if (hasFieldError('expiry')) {
        <small>Usa el formato MM/AA.</small>
      }
    </label>

    <label>
      <span>CVV</span>
      <input
        type="password"
        inputmode="numeric"
        autocomplete="cc-csc"
        formControlName="cvv"
        placeholder="123"
        [attr.aria-invalid]="hasFieldError('cvv')"
      />
      @if (hasFieldError('cvv')) {
        <small>Ingresa 3 o 4 dígitos.</small>
      }
    </label>

    <button class="primary-button" type="submit">Guardar cambios</button>
  </form>
</section>
