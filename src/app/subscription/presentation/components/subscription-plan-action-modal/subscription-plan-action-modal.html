<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="plan-action-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="plan-action-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button
    class="icon-button"
    type="button"
    [attr.aria-label]="'subscription.modal.close' | translate"
    (click)="close()"
  >×</button>
  <p class="eyebrow">{{ 'subscription.modal.eyebrow' | translate }}</p>
  <h2 id="plan-action-modal-title">{{ title() | translate }}</h2>

  <article class="message-card">
    <div>
      <h3>{{ cardTitle() | translate }}</h3>
      <p>{{ cardDescription() }}</p>
    </div>
    <button class="primary-button" type="button" (click)="confirmPrimaryAction()">
      {{ primaryLabel() | translate }}
    </button>
  </article>
</section>
