<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="plan-action-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="plan-action-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button class="icon-button" type="button" [attr.aria-label]="'subscription.modal.close' | translate" (click)="close()">×</button>
  <p class="eyebrow">{{ 'subscription.modal.eyebrow' | translate }}</p>
  <h2 id="plan-action-modal-title">{{ titleKey() | translate }}</h2>

  <article class="message-card">
    <div>
      <h3>{{ cardTitleKey() | translate }}</h3>
      <p>{{ cardDescriptionKey() | translate: cardDescriptionParams() }}</p>
    </div>
    <button class="primary-button" type="button" (click)="confirmPrimaryAction()">
      {{ primaryLabelKey() | translate }}
    </button>
  </article>
</section>
