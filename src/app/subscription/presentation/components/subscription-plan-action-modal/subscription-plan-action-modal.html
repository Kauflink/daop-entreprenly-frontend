<div class="modal-backdrop" aria-hidden="true"></div>

<section
  class="plan-action-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="plan-action-modal-title"
  cdkTrapFocus
  cdkTrapFocusAutoCapture
>
  <button class="icon-button" type="button" aria-label="Cerrar modal" (click)="close()">×</button>
  <p class="eyebrow">Suscripción</p>
  <h2 id="plan-action-modal-title">{{ title() }}</h2>

  <article class="message-card">
    <div>
      <h3>{{ cardTitle() }}</h3>
      <p>{{ cardDescription() }}</p>
    </div>
    <button class="primary-button" type="button" (click)="confirmPrimaryAction()">
      {{ primaryLabel() }}
    </button>
  </article>
</section>
