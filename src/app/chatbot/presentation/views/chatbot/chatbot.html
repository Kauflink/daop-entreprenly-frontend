<div class="p-8">
  <h1 class="text-2xl font-bold text-gray-900">Chatbot</h1>

  @if (store.session() === null || store.session()?.status === 'disconnected') {
    <p class="mb-6 mt-1 text-sm text-gray-500">Conecta tu WhatsApp Business para activar el chatbot</p>
    <div class="rounded-2xl bg-white shadow-sm">
      <app-qr-connection-card [hasError]="false" />
    </div>
  } @else {
    <p class="mb-6 mt-1 text-sm text-gray-500">Estado de la conexión</p>
    <app-whatsapp-status-card [session]="store.session()" [justConnected]="false" />
  }
</div>
