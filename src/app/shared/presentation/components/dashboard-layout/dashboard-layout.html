<div class="dashboard-shell" [class.dashboard-shell--menu-open]="sidebarOpen()">
  <!-- Mobile top bar with hamburger (hidden on desktop) -->
  <header class="topbar">
    <button
      class="hamburger"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      [attr.aria-label]="'dashboard.sidebarLabel' | translate"
    >
      <mat-icon aria-hidden="true">{{ sidebarOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
    <img class="topbar__logo" src="assets/brand/entreprenly-logo-dashboard.png" alt="Entreprenly" />
  </header>

  <!-- Backdrop shown behind the drawer on mobile -->
  <div class="backdrop" (click)="closeSidebar()" aria-hidden="true"></div>

  <aside
    class="sidebar"
    [class.sidebar--open]="sidebarOpen()"
    [attr.aria-label]="'dashboard.sidebarLabel' | translate"
  >
    <div class="brand">
      <img
        class="brand__logo"
        ngSrc="assets/brand/entreprenly-logo-dashboard.png"
        alt="Entreprenly"
        width="220"
        height="60"
        priority
      />
    </div>

    <a
      class="profile"
      routerLink="/dashboard/profile"
      routerLinkActive="profile--active"
      (click)="closeSidebar()"
      [attr.aria-label]="'dashboard.currentUserLabel' | translate"
    >
      <span class="profile__avatar" aria-hidden="true">
        @if (profileStore.profile().avatarUrl; as avatar) {
          <img [src]="avatar" alt="" class="profile__avatar-img" />
        } @else {
          <mat-icon>person</mat-icon>
        }
      </span>
      <strong>{{ displayFirstName() || ('dashboard.userFallback' | translate) }}</strong>
    </a>

    <nav>
      <ul class="navigation-list">
        @for (item of navigationItems; track item.route) {
          <li>
            <a
              class="navigation-link"
              routerLinkActive="navigation-link--active"
              [routerLink]="item.route"
              (click)="closeSidebar()"
              [attr.aria-label]="item.labelKey | translate"
            >
              <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span>{{ item.labelKey | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <button class="logout-button" type="button" (click)="logout()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>{{ 'dashboard.logout' | translate }}</span>
    </button>
  </aside>

  <main class="dashboard-content">
    <router-outlet />
  </main>
</div>
