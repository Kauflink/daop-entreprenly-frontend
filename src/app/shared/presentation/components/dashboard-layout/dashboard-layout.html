<div class="dashboard-shell">
  <aside class="sidebar" [attr.aria-label]="'dashboard.sidebarLabel' | translate">
    <div class="brand">
      <img
        class="brand__logo"
        ngSrc="assets/brand/entreprenly-logo-dashboard.png"
        alt="Entreprenly"
        width="220"
        height="60"
        priority
      />
    </div>

    <a
      class="profile"
      routerLink="/dashboard/profile"
      routerLinkActive="profile--active"
      [attr.aria-label]="'dashboard.currentUserLabel' | translate"
    >
      <span class="profile__avatar" aria-hidden="true">
        <mat-icon>person</mat-icon>
      </span>
      <strong>{{ 'dashboard.welcome' | translate }}</strong>
    </a>

    <nav>
      <ul class="navigation-list">
        @for (item of navigationItems; track item.route) {
          <li>
            <a
              class="navigation-link"
              routerLinkActive="navigation-link--active"
              [routerLink]="item.route"
              [attr.aria-label]="item.labelKey | translate"
            >
              <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span>{{ item.labelKey | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <button class="logout-button" type="button">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>{{ 'dashboard.logout' | translate }}</span>
    </button>
  </aside>

  <main class="dashboard-content">
    <router-outlet />
  </main>
</div>
